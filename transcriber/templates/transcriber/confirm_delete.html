{% extends "transcriber/base.html" %}
{% block content %}
<div class="card">
  <h1>Delete Transcription</h1>
  <p>Are you sure you want to delete this transcription? This cannot be undone.</p>
  <blockquote class="quote">{{ object.text }}</blockquote>
  <form method="post" class="actions">
    {% csrf_token %}
    <button class="btn danger-solid" type="submit">Delete</button>
    <a class="btn" href="{% url 'transcriber:list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
