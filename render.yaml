services:
  - type: web
    name: speech-to-text
    runtime: python
    plan: free
    region: singapore
    buildCommand: ./build.sh
    startCommand: daphne -b 0.0.0.0 -p $PORT config.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: speech-to-text-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: speech-to-text-db
    plan: free
    region: singapore
    databaseName: speech_to_text
    user: speech_to_text
