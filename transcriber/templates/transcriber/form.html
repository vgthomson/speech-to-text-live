{% extends "transcriber/base.html" %}
{% block content %}
<div class="card">
  <h1>{% if object %}Edit Transcription{% else %}New Transcription{% endif %}</h1>
  <form method="post" novalidate>
    {% csrf_token %}
    <label for="{{ form.text.id_for_label }}">Transcription text</label>
    {{ form.text }}
    {% for error in form.text.errors %}<p class="error">{{ error }}</p>{% endfor %}
    <div class="actions">
      <button class="btn btn-primary" type="submit">Save</button>
      <a class="btn" href="{% url 'transcriber:list' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
