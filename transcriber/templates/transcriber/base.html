{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speech to Text</title>
  <link rel="stylesheet" href="{% static 'transcriber/app.css' %}?v=4">
</head>
<body>
  <header class="topbar">
    <nav>
      <a href="{% url 'transcriber:live' %}" class="{% if request.resolver_match.url_name == 'live' %}active{% endif %}">Record</a>
      <a href="{% url 'transcriber:list' %}" class="{% if request.resolver_match.url_name != 'live' %}active{% endif %}">History</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script src="{% static 'transcriber/tts.js' %}?v=3" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
